[package]
name = "axis-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "success-metrics"
path = "success_metrics.rs"

[[bin]]
name = "backend-defaults"
path = "backend_defaults.rs"

[[bin]]
name = "backend-evidence"
path = "backend_evidence.rs"

[[bin]]
name = "opa-scenarios"
path = "opa_scenarios.rs"

[[bin]]
name = "mxc-isolation-matrix"
path = "mxc_isolation_matrix.rs"

[[bin]]
name = "runtime-metrics"
path = "runtime_metrics.rs"

[[bin]]
name = "axis-bench"
path = "axis_bench/main.rs"

[[bin]]
name = "axis-bench-child"
path = "axis_bench_child.rs"

[dependencies]
axis-core = { workspace = true }
axis-sandbox = { workspace = true }
axis-proxy = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
